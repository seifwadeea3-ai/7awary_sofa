<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7awary_sofa - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">7awary_sofa</div>
        <nav class="nav-links">
            <a href="#">الرئيسية</a>
            <a href="#">قوانين السوفا</a>
            <a href="#">الدعم الفني</a>
        </nav>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="card-header">
                <img src="https://cdn-icons-png.flaticon.com/512/3824/3824444.png" alt="logo" width="60">
                <h2>دخول 7awary_sofa</h2>
                <p>مرحباً بك في مجتمعنا</p>
            </div>
            
            <form id="loginForm" class="sofa-form">
                <div class="input-box">
                    <input type="text" id="username" placeholder="اسم المستخدم" required>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="كلمة المرور" required>
                </div>
                
                <div class="form-actions">
                    <button type="submit" class="btn-login">دخول الآن</button>
                    <button type="button" class="btn-visitor">دخول الزوار</button>
                </div>

                <div class="form-footer">
                    <a href="#">انضم لعائلة 7awary_sofa</a>
                    <span> | </span>
                    <a href="#">نسيت كلمة السر؟</a>
                </div>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
