<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7awary_sofa | النظام المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

    <div id="loginScreen" class="overlay">
        <div class="login-card">
            <div class="logo-text">7awary_sofa</div>
            <div id="authTabs">
                <button onclick="showAuth('login')">تسجيل دخول</button>
                <button onclick="showAuth('register')">إنشاء حساب</button>
                <button onclick="loginAsGuest()" class="btn-guest">دخول زائر</button>
            </div>
            
            <div id="loginForm" class="sofa-form">
                <input type="text" id="loginName" placeholder="اسم المستخدم" class="input-field">
                <input type="password" id="loginPass" placeholder="كلمة المرور" class="input-field">
                <button onclick="attemptLogin()" class="btn-login">دخول</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="app-container" style="display: none;">
        
        <aside class="sidebar-right">
            <div class="profile-section">
                <div class="avatar-container">
                    <img id="userAvatar" src="default-avatar.png" alt="Avatar">
                </div>
                <div id="userNameDisplay" class="user-name"></div>
                <div id="userRankBadge" class="rank-badge">بدون رتبة</div>
            </div>

            <nav class="main-nav">
                <div class="nav-item" onclick="switchView('chat')">💬 الشات</div>
                <div class="nav-item" onclick="switchView('groups')">👥 الجروبات</div>
                <div class="nav-item" onclick="openStore()">🏪 المتجر</div>
                <div class="nav-item" onclick="openRewards()">🎁 المكافآت <span id="rewardDot" class="dot"></span></div>
                <div class="nav-item" onclick="openNotifications()">🔔 الإشعارات <span id="notifCount" class="badge">0</span></div>
                <div class="nav-item" onclick="openSettings()">⚙️ الإعدادات</div>
                <div class="nav-item nav-admin" id="adminTab" style="display:none;" onclick="switchView('admin')">👑 الإدارة</div>
            </nav>

            <div class="coin-balance">
                <span id="coinDisplay">0</span> 🪙
            </div>
        </aside>

        <main class="main-content">
            <div id="viewChat" class="view-panel">
                <div class="chat-tabs">
                    <button class="active">شات الجروبات</button>
                    <button>شات خاص</button>
                </div>
                <div id="chatBox" class="chat-msgs"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="اكتب منشن @ أو رسالة...">
                    <button onclick="sendMessage()" class="btn-main">إرسال</button>
                </div>
            </div>

            <div id="viewGroups" class="view-panel" style="display:none;">
                <div class="view-header">
                    <h3>المجموعات (<span id="groupsCount">0</span>)</h3>
                    <button class="btn-create" onclick="createGroup()">+ إنشاء جروب (30k)</button>
                </div>
                <div id="groupsGrid" class="groups-grid"></div>
            </div>
        </main>

        <aside class="sidebar-left">
            <h4>المتواجدون (<span id="totalOnline">0</span>)</h4>
            <div id="onlineList"></div>
            <hr>
            <h4>أحداث اليوم 📅</h4>
            <div class="daily-events" id="eventsList">
                <p>لا توجد أحداث حالياً</p>
            </div>
        </aside>
    </div>

    <div id="rewardModal" class="modal">
        <div class="modal-content">
            <h3>🎁 مركز المكافآت</h3>
            <div id="timerContainer">
                <p>الوقت المتبقي للاستلام:</p>
                <div id="countdown">00:00</div>
            </div>
            <button id="claimBtn" disabled onclick="claimCoins()">استلام الكوينز</button>
            <p class="info">معدلك الحالي: <span id="earnRate">1000</span> كوينز/ساعة</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
