<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7awary_sofa | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" class="overlay">
        <div class="login-card">
            <div class="logo-text">7awary_sofa</div>
            <p>سجل دخولك للانضمام للسوفا</p>
            <div class="sofa-form">
                <input type="text" id="loginName" placeholder="اسم المستخدم" class="input-field">
                <input type="password" id="loginPass" placeholder="كلمة المرور" class="input-field">
                <button onclick="attemptLogin()" class="btn-login">دخول الآن</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="app-container" style="display: none;">
        
        <aside class="sidebar-right">
            <div class="profile-section">
                <div id="userNameDisplay" style="font-weight: bold; font-size: 18px; margin-bottom: 5px;"></div>
                <span id="adminBadge" class="badge-black" style="display:none;">المشرف العام</span>
                
                <div class="stats">
                    <p>الرتبة: <span id="rankDisplay"></span></p>
                    <p>الكوينز: <span id="coinDisplay"></span> 💰</p>
                    <p>الرسايل: <span id="msgCurrent"></span></p>
                </div>

                <div style="background: #0b0f11; padding: 10px; border-radius: 8px; margin: 10px 0; border: 1px solid #242f35;">
                    <div style="font-size: 12px; color: var(--accent);">الهدايا: لا يوجد حالياً</div>
                    <div style="font-size: 12px; margin-top:5px;">الأوسمة: 🇪🇬 🎖️</div>
                </div>

                <div class="progress-track"><div id="lvlBar" class="progress-fill"></div></div>
                <small>المستوى: <span id="lvlVal">0</span></small>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item" onclick="switchView('chat')">الدردشة العامة</div>
                <div class="nav-item" onclick="switchView('groups')">المجموعات</div>
                <div class="nav-item nav-admin" id="adminTab" style="display:none;" onclick="switchView('admin')">لوحة المشرف</div>
                <div class="nav-item" onclick="openSettings()">الإعدادات</div>
            </nav>
            <div class="timer-box" style="text-align:center; margin-top:10px;">الهدية: <span id="countdown">00:00</span></div>
        </aside>

        <main class="main-content">
            <div id="viewChat" class="view-panel">
                <h3>الغرفة العامة</h3>
                <div id="chatBox" class="chat-msgs"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
                    <button onclick="sendMessage()" class="btn-main">إرسال</button>
                </div>
            </div>

            <div id="viewGroups" class="view-panel" style="display:none;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>المجموعات</h3>
                    <button class="btn-create" onclick="openCreateGroupModal()">+ إنشاء جروب</button>
                </div>
                <div id="groupsGrid" class="groups-grid"></div>
            </div>

            <div id="viewAdmin" class="view-panel" style="display:none;">
                <h3>صلاحيات المشرف Sofa</h3>
                <div class="admin-actions" style="display:flex; flex-direction:column; gap:10px;">
                    <button class="btn-danger" onclick="adminAction('تعطيل الجروبات')">تعطيل كافة الجروبات</button>
                    <button class="btn-danger" onclick="adminAction('حظر الـ IP')">حظر شامل للمخالفين</button>
                    <button class="btn-danger" onclick="adminAction('تصفير الكوينز')">تصفير كوينز المشاغبين</button>
                </div>
            </div>
        </main>

        <aside class="sidebar-left">
            <h4>المتواجدون (<span id="totalOnline">0</span>)</h4>
            <div id="onlineList" style="display:flex; flex-direction:column; gap:15px; align-items:center;"></div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
