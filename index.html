<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشات العربي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header id="login-header">
            <h1>موقع الشات</h1>
            <div class="user-login">
                <input type="text" id="username" placeholder="اسمك">
                <input type="password" id="password" placeholder="كلمة المرور">
                <button onclick="login()">دخول</button>
                <button onclick="guestLogin()">حساب زائر</button>
                <button onclick="createAccount()">إنشاء حساب</button>
            </div>
        </header>

        <main id="chat-section" style="display: none;">
            <div class="user-bar">
                <span>مرحباً: <b id="display-username"></b></span>
                <span>العملات: <b id="coins-display">0</b></span>
            </div>
            <div id="chat-box">
                </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
