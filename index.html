<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7awary_sofa | لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" class="overlay">
        <div class="login-card">
            <div class="logo-text">7awary_sofa</div>
            <p>سجل دخولك للانضمام للسوفا</p>
            <div class="sofa-form">
                <input type="text" id="loginName" placeholder="اسم المستخدم" class="input-field">
                <input type="password" id="loginPass" placeholder="كلمة المرور" class="input-field">
                <button onclick="attemptLogin()" class="btn-login">دخول الآن</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="app-container" style="display: none;">
        <aside class="sidebar-right">
            <div class="profile-card-dark">
                <div class="profile-header-gradient">
                    <img src="https://i.pravatar.cc/80?u=sofa" class="u-avatar-main">
                </div>
                <div class="profile-content">
                    <div id="userNameDisplay"></div>
                    <span id="adminBadge" class="badge-black" style="display:none;">المشرف العام</span>
                    <div class="stats-box">
                        <p>الرتبة: <span id="rankDisplay"></span></p>
                        <p>الكوينز: <span id="coinDisplay"></span> 💰</p>
                        <p>الرسايل: <span id="msgCurrent"></span></p>
                    </div>
                    <div class="mini-section">
                        <small>الهدايا</small>
                        <p>لا توجد هدايا حتى الآن</p>
                    </div>
                    <div class="mini-section">
                        <small>الأوسمة</small>
                        <div class="badges">🇪🇬 🎖️</div>
                    </div>
                    <div class="upgrade-box">
                        <p>🎯 الترقية إلى المستوى <span id="lvlValNext">1</span></p>
                        <div class="progress-track"><div id="lvlBar" class="progress-fill"></div></div>
                        <small>المستوى الحالي: <span id="lvlVal">0</span></small>
                    </div>
                    <button class="btn-settings-blue" onclick="openSettings()">الإعدادات العامة</button>
                </div>
            </div>
            <nav class="nav-menu">
                <div class="nav-item" onclick="switchView('chat')">الدردشة العامة</div>
                <div class="nav-item" onclick="switchView('groups')">المجموعات</div>
                <div class="nav-item nav-admin" id="adminTab" style="display:none;" onclick="switchView('admin')">لوحة المشرف</div>
            </nav>
            <div class="timer-box">الهدية: <span id="countdown">00:00</span></div>
        </aside>

        <main class="main-content">
            <div id="viewChat" class="view-panel">
                <h3>الغرفة العامة</h3>
                <div id="chatBox" class="chat-msgs"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="اكتب رسالتك هنا...">
                    <button onclick="sendMessage()" class="btn-main">إرسال</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
