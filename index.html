<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الشات العربي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        
        /* تصميم الأزرار والحقول */
        input { padding: 10px; width: 80%; margin: 5px; border-radius: 5px; border: none; }
        button { padding: 10px 20px; margin: 5px; border-radius: 5px; border: none; cursor: pointer; color: white; font-weight: bold; }
        button.green { background-color: #28a745; }
        button.blue { background-color: #007bff; }
        button:hover { opacity: 0.8; }

        /* الأقسام */
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; border: 1px solid #333; margin-bottom: 20px; }
        .hidden { display: none !important; }

        /* الشات */
        #chat-box { height: 250px; overflow-y: auto; background: #000; padding: 10px; border-radius: 5px; text-align: right; margin-bottom: 10px; }
        .msg { background: #333; padding: 5px 10px; margin: 5px; border-radius: 5px; display: inline-block; width: 90%; }
        .username { color: #ffc107; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        
        <div id="login-screen" class="box">
            <h1>💬 موقع الشات العربي</h1>
            <p>سجل دخولك عشان تبدأ الدردشة وتجمع كوينز!</p>
            
            <input type="text" id="username-input" placeholder="اسم المستخدم">
            <input type="password" id="password-input" placeholder="كلمة المرور">
            <br>
            <button class="green" onclick="login()">دخول</button>
            <button class="blue" onclick="createAccount()">إنشاء حساب جديد</button>
        </div>

        <div id="main-app" class="box hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span>👤 مرحباً: <span id="display-name" style="color: #00bcd4;"></span></span>
                <span>💰 الكوينز: <span id="coins-display">0</span></span>
            </div>

            <div id="chat-box">
                <div class="msg">مرحباً بك في الشات! ابدأ الكلام..</div>
            </div>
            
            <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا...">
            <button class="green" onclick="sendMessage()">إرسال 🚀</button>

            <hr style="border-color: #333; margin: 20px 0;">

            <button onclick="alert('قريباً: شراء رتب وأوسمة!')">المتجر 🛒</button>
            <button onclick="logout()">خروج 🚪</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
